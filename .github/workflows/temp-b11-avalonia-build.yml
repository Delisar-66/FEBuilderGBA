name: Temporary Avalonia B11 Build

on:
  push:
    branches:
      - fix/avalonia-b11-weaponlockarray-v2

permissions:
  contents: read

jobs:
  avalonia-build:
    name: Build Avalonia Item Editor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize build-required submodules
        run: |
          git submodule update --init config/patch2 resources/fe-info

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore Avalonia project
        run: dotnet restore FEBuilderGBA.Avalonia/FEBuilderGBA.Avalonia.csproj

      - name: Build Avalonia project
        run: dotnet build FEBuilderGBA.Avalonia/FEBuilderGBA.Avalonia.csproj -c Release --no-restore
