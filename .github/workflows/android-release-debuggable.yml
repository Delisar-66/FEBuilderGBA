name: Android Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test:
    name: Build optimized debuggable test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize required submodules
        run: |
          git submodule update --init \
            config/patch2 \
            tools/Event-Assembler \
            tools/ColorzCore \
            resources/fe-info

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-android-${{ runner.os }}-

      - name: Install Android workload
        run: dotnet workload install android

      - name: Rename test app
        run: |
          sed -i 's/Label = "FEBuilderGBA"/Label = "FEBuilderGBA Test"/' \
            FEBuilderGBA.Android/MainActivity.cs

      - name: Build optimized debuggable APK
        run: |
          dotnet build FEBuilderGBA.Android/FEBuilderGBA.Android.csproj \
            -c Release \
            -warnaserror \
            -p:EnableAndroidTarget=true \
            -p:ApplicationId=com.laqieer.febuildergba.test \
            -p:DebugSymbols=true \
            -p:DebugType=Full

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: febuildergba-test-apk
          path: FEBuilderGBA.Android/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error
